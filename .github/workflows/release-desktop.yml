name: Release AxEin Billing

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag
        required: true
        default: v1.2.0

permissions:
  contents: write

env:
  LOCAL_IMAGE_NAME: axein-billing-promedix
  APP_VERSION: 1.2.0
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Build Next.js application
        working-directory: app
        run: npm run build

  container:
    runs-on: ${{ matrix.runner }}
    needs: web-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build portable application image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: ${{ matrix.platform }}
          tags: ${{ env.LOCAL_IMAGE_NAME }}:${{ env.APP_VERSION }}
          outputs: type=docker,dest=${{ runner.temp }}/AxEin-Billing-Image-linux-${{ matrix.architecture }}.tar
          cache-from: type=gha,scope=image-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.architecture }}
      - name: Compress application image
        run: gzip -9 "${{ runner.temp }}/AxEin-Billing-Image-linux-${{ matrix.architecture }}.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: container-image-${{ matrix.architecture }}
          path: ${{ runner.temp }}/AxEin-Billing-Image-linux-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    needs: web-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: app/desktop
        run: npm ci
      - name: Build Windows installer
        working-directory: app/desktop
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: app/desktop/dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    needs: web-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: app/desktop
        run: npm ci
      - name: Build macOS installers
        working-directory: app/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            app/desktop/dist/*.dmg
            app/desktop/dist/*.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [container, windows, macos]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
          pattern: "!*.dockerbuild"
      - name: Add Windows bootstrap and checksums
        run: |
          cp app/axein-windows-bundle/axein-bootstrap.py release/AxEin-Windows-Bootstrap.py
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -lah
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "AxEin Billing 1.2.0" \
              --generate-notes \
              --notes "Windows and macOS desktop installers use the same AxEin Billing application as the browser edition. The first launch downloads the matching application image from this release; no GHCR login is required. Docker Desktop is required. Unsigned installers may show an operating-system security prompt."
          fi
