name: Release AxEin Billing

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag
        required: true
        default: v1.4.0

permissions:
  contents: write

env:
  APP_VERSION: 1.4.0
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Build Next.js application
        working-directory: app
        run: npm run build

  windows:
    runs-on: windows-latest
    needs: web-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            app/desktop/package-lock.json
      - name: Install application dependencies
        working-directory: app
        run: npm ci
      - name: Install desktop dependencies
        working-directory: app/desktop
        run: npm ci
      - name: Build and verify embedded application runtime
        working-directory: app
        run: |
          npm run desktop:web:build
          npm run desktop:prepare-runtime
          npm run desktop:runtime:smoke
          npm run desktop:bundle-node
      - name: Build Windows installer
        working-directory: app/desktop
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: app/desktop/dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: ${{ matrix.runner }}
    needs: web-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: macos-15-intel
          - architecture: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            app/desktop/package-lock.json
      - name: Install application dependencies
        working-directory: app
        run: npm ci
      - name: Install desktop dependencies
        working-directory: app/desktop
        run: npm ci
      - name: Build and verify embedded application runtime
        working-directory: app
        run: |
          npm run desktop:web:build
          npm run desktop:prepare-runtime
          npm run desktop:runtime:smoke
          npm run desktop:bundle-node
      - name: Build macOS installers
        working-directory: app/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --${{ matrix.architecture }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer-${{ matrix.architecture }}
          path: |
            app/desktop/dist/*.dmg
            app/desktop/dist/*.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [windows, macos]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
          pattern: "!*.dockerbuild"
      - name: Add checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -lah
      - name: Configure private release server access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AXEIN_RELEASE_SSH_KEY }}
          SSH_HOST: ${{ secrets.AXEIN_RELEASE_SSH_HOST }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}" || { echo "AXEIN_RELEASE_SSH_KEY is not configured"; exit 1; }
          test -n "${SSH_HOST}" || { echo "AXEIN_RELEASE_SSH_HOST is not configured"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/axein_release
          chmod 600 ~/.ssh/axein_release
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/axein_release "axein@${SSH_HOST}" \
            "install -d -m 700 '/srv/axein/release-staging/${RELEASE_TAG}'"
      - name: Upload installers to private storage
        env:
          SSH_HOST: ${{ secrets.AXEIN_RELEASE_SSH_HOST }}
        run: |
          set -euo pipefail
          register_artifact() {
            local file="$1"
            local platform="$2"
            local architecture="$3"
            local requirements="$4"
            local name
            name="$(basename "$file")"
            echo "Publishing ${name} for ${platform}/${architecture}"
            scp -i ~/.ssh/axein_release "$file" \
              "axein@${SSH_HOST}:/srv/axein/release-staging/${RELEASE_TAG}/${name}"
            ssh -i ~/.ssh/axein_release "axein@${SSH_HOST}" \
              "BILLING_PRIVATE_DOWNLOAD_ROOT=/srv/axein/private-downloads \
                /srv/axein/app/.venv/bin/python /srv/axein/app/manage.py register_billing_release \
                '/srv/axein/release-staging/${RELEASE_TAG}/${name}' \
                --release-version '${APP_VERSION}' \
                --platform '${platform}' \
                --architecture '${architecture}' \
                --requirements '${requirements}' \
                --release-notes 'Docker-free native installer with embedded database, portal-managed single-device activation, healthcare billing, inventory, accounting, GST reports, customer debt, quotations, backups, and the complete AxEin Billing feature set.'"
          }

          shopt -s nullglob
          for file in release/*.exe; do
            register_artifact "$file" windows x64 "Windows 10/11 64-bit; 4 GB RAM minimum; 8 GB recommended; 2 GB free disk space; no Docker required."
          done
          for file in release/*.dmg; do
            case "$(basename "$file")" in
              *arm64*) register_artifact "$file" macos arm64 "macOS 11 or newer on Apple Silicon; 4 GB RAM minimum; 8 GB recommended; 2 GB free disk space; no Docker required." ;;
              *x64*|*intel*) register_artifact "$file" macos x64 "macOS 11 or newer on an Intel Mac; 4 GB RAM minimum; 8 GB recommended; 2 GB free disk space; no Docker required." ;;
            esac
          done
          ssh -i ~/.ssh/axein_release "axein@${SSH_HOST}" \
            "rm -rf '/srv/axein/release-staging/${RELEASE_TAG}'"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "AxEin Billing 1.4.0" \
              --generate-notes \
              --notes "Windows and macOS installers now contain the complete AxEin Billing application and a private embedded database. Docker Desktop, Node.js, PostgreSQL, Redis, MinIO, Git, GHCR credentials, and source builds are not required. Customer data persists locally across upgrades. Portal-managed single-device activation remains enabled. Unsigned installers may show an operating-system security prompt."
          fi
