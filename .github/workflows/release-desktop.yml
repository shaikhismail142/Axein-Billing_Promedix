name: Release AxEin Billing

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag
        required: true
        default: v1.2.0
      image_tag:
        description: Container image tag used by the desktop apps
        required: true
        default: 2026-07-20-v1

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/shaikhismail142/axein-billing-promedix
  IMAGE_TAG: ${{ inputs.image_tag || '2026-07-20-v1' }}
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Build Next.js application
        working-directory: app
        run: npm run build

  container:
    runs-on: ubuntu-latest
    needs: web-build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:1.2.0
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows:
    runs-on: windows-latest
    needs: web-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: app/desktop
        run: npm ci
      - name: Build Windows installer
        working-directory: app/desktop
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: app/desktop/dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    needs: web-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: app/desktop
        run: npm ci
      - name: Build macOS installers
        working-directory: app/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            app/desktop/dist/*.dmg
            app/desktop/dist/*.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [container, windows, macos]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Add Windows bootstrap and checksums
        run: |
          cp app/axein-windows-bundle/axein-bootstrap.py release/AxEin-Windows-Bootstrap.py
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -lah
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "AxEin Billing 1.2.0" \
              --generate-notes \
              --notes "Windows and macOS desktop installers use the same multi-architecture AxEin Billing image as the browser edition. Docker Desktop is required. Unsigned installers may show an operating-system security prompt."
          fi
