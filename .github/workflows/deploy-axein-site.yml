name: Deploy Axein control room

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: axein.in branch or tag to deploy
        required: true
        default: main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure release server access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AXEIN_RELEASE_SSH_KEY }}
          SITE_DEPLOY_KEY: ${{ secrets.AXEIN_SITE_DEPLOY_KEY }}
          SSH_HOST: ${{ secrets.AXEIN_RELEASE_SSH_HOST }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}" || { echo "AXEIN_RELEASE_SSH_KEY is not configured"; exit 1; }
          test -n "${SITE_DEPLOY_KEY}" || { echo "AXEIN_SITE_DEPLOY_KEY is not configured"; exit 1; }
          test -n "${SSH_HOST}" || { echo "AXEIN_RELEASE_SSH_HOST is not configured"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/axein_release
          chmod 600 ~/.ssh/axein_release
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Check out private axein.in source
        uses: actions/checkout@v4
        with:
          repository: shaikhismail142/axein.in
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.AXEIN_SITE_DEPLOY_KEY }}
          persist-credentials: false
          path: site-source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site-source/platform/axein-modern/package-lock.json

      - name: Build and validate website
        working-directory: site-source/platform/axein-modern
        env:
          AXEIN_BASE_PATH: /control-room
          AXEIN_PUBLIC_ORIGIN: https://axein.in
          AXEIN_PUBLIC_NOINDEX: "1"
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run package:standalone
          test -s dist/axein-modern-standalone.tgz

      - name: Upload standalone website bundle
        env:
          SSH_HOST: ${{ secrets.AXEIN_RELEASE_SSH_HOST }}
        run: |
          set -euo pipefail
          revision="$(git -C site-source rev-parse HEAD)"
          staging="/srv/axein/site-staging/${GITHUB_RUN_ID}"
          ssh -i ~/.ssh/axein_release "axein@${SSH_HOST}" "install -d -m 700 '${staging}'"
          uploaded=0
          for attempt in 1 2 3; do
            if timeout 180 scp -C \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              -i ~/.ssh/axein_release \
              site-source/platform/axein-modern/dist/axein-modern-standalone.tgz \
              "axein@${SSH_HOST}:${staging}/axein-modern-standalone.tgz"; then
              uploaded=1
              break
            fi
            echo "Bundle upload attempt ${attempt} failed; retrying."
            sleep 5
          done
          test "${uploaded}" -eq 1
          printf 'revision=%s\n' "${revision}" >> "${GITHUB_ENV}"
          printf 'staging=%s\n' "${staging}" >> "${GITHUB_ENV}"

      - name: Deploy website with automatic rollback
        env:
          SSH_HOST: ${{ secrets.AXEIN_RELEASE_SSH_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/axein_release "axein@${SSH_HOST}" \
            "REVISION='${revision}' STAGING='${staging}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          bundle="${STAGING}/axein-modern-standalone.tgz"
          test -s "${bundle}"
          release_id="$(date -u +%Y%m%d%H%M%S)-${REVISION:0:8}"
          build_root="/srv/axein/site-builds/${release_id}"
          install -d "${build_root}"

          service=""
          for candidate in axein-modern.service axein-frontend.service axein-control-room.service; do
            exec_start="$(systemctl show "${candidate}" --property=ExecStart --value 2>/dev/null || true)"
            if printf '%s' "${exec_start}" | grep -Eqi 'node|next'; then
              service="${candidate}"
              break
            fi
          done
          if [ -z "${service}" ]; then
            echo "No supported Axein Next.js service was found." >&2
            exit 1
          fi

          can_sudo=0
          if sudo -n true 2>/dev/null; then
            can_sudo=1
          fi
          node_bin="$(command -v node)"
          test -x "${node_bin}"

          current="$(systemctl show "${service}" --property=WorkingDirectory --value)"
          exec_start="$(systemctl show "${service}" --property=ExecStart --value)"
          service_user="$(systemctl show "${service}" --property=User --value)"
          restart_policy="$(systemctl show "${service}" --property=Restart --value)"
          restart_delay="$(systemctl show "${service}" --property=RestartUSec --value)"
          service_environment="$(systemctl show "${service}" --property=Environment --value)"
          service_port="$(printf '%s' "${service_environment}" | tr ' ' '\n' | sed -n 's/^PORT=//p' | head -n 1)"
          service_port="${service_port:-3100}"
          test -n "${current}"
          echo "Deploying ${service}; user=${service_user:-system}; workdir=${current}; restart=${restart_policy}; restart-delay=${restart_delay:-unknown}; sudo=${can_sudo}"
          echo "Service command: ${exec_start}"

          release_dir="/srv/axein/site-releases/${release_id}"
          install -d "${release_dir}"
          tar -xzf "${bundle}" -C "${release_dir}"
          test -s "${release_dir}/server.js"

          if printf '%s' "${exec_start}" | grep -Fq '.next/standalone/server.js'; then
            mkdir -p "${release_dir}/.next"
            ln -sfn .. "${release_dir}/.next/standalone"
            test -s "${release_dir}/.next/standalone/server.js"
          fi

          if [ -n "${current}" ] && [ -e "${current}/.env" ]; then
            cp "${current}/.env" "${release_dir}/.env"
          fi
          if [ -n "${current}" ] && [ -e "${current}/.env.local" ]; then
            cp "${current}/.env.local" "${release_dir}/.env.local"
          fi

          dropin_dir="/etc/systemd/system/${service}.d"
          override="${dropin_dir}/axein-release.conf"
          previous_override="${build_root}/previous-axein-release.conf"
          had_override=0
          if [ "${can_sudo}" -eq 1 ] && sudo test -f "${override}"; then
            sudo cat "${override}" > "${previous_override}"
            had_override=1
          fi

          swap_mode=""
          previous_target=""
          rollback_dir=""

          restart_service() {
            if [ "${can_sudo}" -eq 1 ]; then
              sudo systemctl restart "${service}"
              return
            fi
            if systemctl restart "${service}" >/dev/null 2>&1; then
              return
            fi

            old_pid="$(systemctl show "${service}" --property=MainPID --value)"
            if [ "${restart_policy}" = "no" ]; then
              echo "Cannot restart ${service} without passwordless sudo or a systemd restart policy." >&2
              return 1
            fi
            if [ "${old_pid:-0}" -le 1 ]; then
              for attempt in $(seq 1 30); do
                new_pid="$(systemctl show "${service}" --property=MainPID --value)"
                if systemctl is-active --quiet "${service}" && [ "${new_pid:-0}" -gt 1 ]; then
                  return
                fi
                sleep 1
              done
              echo "Systemd did not automatically recover ${service}." >&2
              return 1
            fi
            kill -TERM "${old_pid}"
            # Some hosts deliberately use a 30-60 second RestartSec. Wait long
            # enough for systemd to replace the process before deciding to roll
            # back an otherwise healthy release.
            for attempt in $(seq 1 120); do
              new_pid="$(systemctl show "${service}" --property=MainPID --value)"
              if systemctl is-active --quiet "${service}" \
                && [ "${new_pid:-0}" -gt 1 ] \
                && [ "${new_pid}" != "${old_pid}" ]; then
                return
              fi
              sleep 1
            done
            return 1
          }

          rollback_service() {
            echo "Deployment check failed. Restoring the previous service configuration." >&2
            case "${swap_mode}" in
              dropin)
                if [ "${had_override}" -eq 1 ]; then
                  sudo install -D -m 644 "${previous_override}" "${override}"
                else
                  sudo rm -f "${override}"
                fi
                sudo systemctl daemon-reload
                ;;
              symlink)
                ln -sfn "${previous_target}" "${current}"
                ;;
              directory)
                unlink "${current}"
                mv "${rollback_dir}" "${current}"
                ;;
            esac
            restart_service || true
          }

          if [ "${can_sudo}" -eq 1 ]; then
            {
              printf '[Service]\n'
              printf 'WorkingDirectory=%s\n' "${release_dir}"
              printf 'ExecStart=\n'
              printf 'ExecStart=%s %s/server.js\n' "${node_bin}" "${release_dir}"
            } > "${build_root}/axein-release.conf"
            sudo install -D -m 644 "${build_root}/axein-release.conf" "${override}"
            sudo systemctl daemon-reload
            swap_mode="dropin"
          else
            current_parent="$(dirname "${current}")"
            test -w "${current_parent}" || {
              echo "The deployment user cannot update ${current_parent} and has no passwordless sudo." >&2
              exit 1
            }
            if [ -L "${current}" ]; then
              previous_target="$(readlink "${current}")"
              ln -sfn "${release_dir}" "${current}"
              swap_mode="symlink"
            elif [ -d "${current}" ]; then
              rollback_dir="${current}.rollback-${release_id}"
              mv "${current}" "${rollback_dir}"
              ln -s "${release_dir}" "${current}"
              swap_mode="directory"
            else
              echo "WorkingDirectory is neither a symlink nor a directory: ${current}" >&2
              exit 1
            fi
          fi

          if ! restart_service; then
            journalctl -u "${service}" -n 100 --no-pager || true
            rollback_service
            exit 1
          fi

          ready=0
          for attempt in $(seq 1 20); do
            if systemctl is-active --quiet "${service}" \
              && curl -fsS --max-time 15 \
                "http://127.0.0.1:${service_port}/control-room/api/v1/health" \
                | grep -q '"ok":true'; then
              ready=1
              break
            fi
            sleep 3
          done
          if [ "${ready}" -ne 1 ]; then
            journalctl -u "${service}" -n 100 --no-pager || true
            rollback_service
            exit 1
          fi

          if [ -x /srv/axein/app/.venv/bin/python ] && [ -f /srv/axein/app/manage.py ]; then
            BILLING_PRIVATE_DOWNLOAD_ROOT=/srv/axein/private-downloads \
              /srv/axein/app/.venv/bin/python /srv/axein/app/manage.py shell <<'PYTHON'
          from billing_portal.models import BillingRelease

          pairs = BillingRelease.objects.filter(is_active=True).values_list(
              "edition_id", "platform", "architecture"
          ).distinct()
          for edition_id, platform, architecture in pairs:
              releases = BillingRelease.objects.filter(
                  edition_id=edition_id,
                  platform=platform,
                  architecture=architecture,
                  is_active=True,
              ).order_by("-published_at", "-id")
              latest = releases.first()
              if latest:
                  releases.exclude(pk=latest.pk).update(is_active=False)
          PYTHON
          fi

          rm -f "${bundle}"
          rmdir "${STAGING}" 2>/dev/null || true
          echo "Website deployment completed through ${service} at revision ${REVISION}."
          REMOTE_SCRIPT
