name: Deploy Axein website

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: axein.in branch or tag to deploy
        required: true
        default: main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure release server access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AXEIN_RELEASE_SSH_KEY }}
          SITE_DEPLOY_KEY: ${{ secrets.AXEIN_SITE_DEPLOY_KEY }}
          SSH_HOST: ${{ secrets.AXEIN_RELEASE_SSH_HOST }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}" || { echo "AXEIN_RELEASE_SSH_KEY is not configured"; exit 1; }
          test -n "${SITE_DEPLOY_KEY}" || { echo "AXEIN_SITE_DEPLOY_KEY is not configured"; exit 1; }
          test -n "${SSH_HOST}" || { echo "AXEIN_RELEASE_SSH_HOST is not configured"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/axein_release
          chmod 600 ~/.ssh/axein_release
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Check out private axein.in source
        uses: actions/checkout@v4
        with:
          repository: shaikhismail142/axein.in
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.AXEIN_SITE_DEPLOY_KEY }}
          persist-credentials: false
          path: site-source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site-source/platform/axein-modern/package-lock.json

      - name: Build and validate website
        working-directory: site-source/platform/axein-modern
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run package:standalone
          test -s dist/axein-modern-standalone.tgz

      - name: Upload standalone website bundle
        env:
          SSH_HOST: ${{ secrets.AXEIN_RELEASE_SSH_HOST }}
        run: |
          set -euo pipefail
          revision="$(git -C site-source rev-parse HEAD)"
          staging="/srv/axein/site-staging/${GITHUB_RUN_ID}"
          ssh -i ~/.ssh/axein_release "axein@${SSH_HOST}" "install -d -m 700 '${staging}'"
          scp -i ~/.ssh/axein_release \
            site-source/platform/axein-modern/dist/axein-modern-standalone.tgz \
            "axein@${SSH_HOST}:${staging}/axein-modern-standalone.tgz"
          printf 'revision=%s\n' "${revision}" >> "${GITHUB_ENV}"
          printf 'staging=%s\n' "${staging}" >> "${GITHUB_ENV}"

      - name: Deploy website with automatic rollback
        env:
          SSH_HOST: ${{ secrets.AXEIN_RELEASE_SSH_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/axein_release "axein@${SSH_HOST}" \
            "REVISION='${revision}' STAGING='${staging}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          bundle="${STAGING}/axein-modern-standalone.tgz"
          test -s "${bundle}"
          release_id="$(date -u +%Y%m%d%H%M%S)-${REVISION:0:8}"
          build_root="/srv/axein/site-builds/${release_id}"
          install -d "${build_root}"

          service=""
          for candidate in axein-modern.service axein-frontend.service axein-control-room.service; do
            exec_start="$(systemctl show "${candidate}" --property=ExecStart --value 2>/dev/null || true)"
            if printf '%s' "${exec_start}" | grep -Eqi 'node|next'; then
              service="${candidate}"
              break
            fi
          done
          if [ -z "${service}" ]; then
            echo "No supported Axein Next.js service was found." >&2
            exit 1
          fi
          sudo -n true
          node_bin="$(command -v node)"
          test -x "${node_bin}"

          current="$(systemctl show "${service}" --property=WorkingDirectory --value)"
          release_dir="/srv/axein/site-releases/${release_id}"
          install -d "${release_dir}"
          tar -xzf "${bundle}" -C "${release_dir}"
          test -s "${release_dir}/server.js"

          if [ -n "${current}" ] && [ -e "${current}/.env" ]; then
            cp "${current}/.env" "${release_dir}/.env"
          fi
          if [ -n "${current}" ] && [ -e "${current}/.env.local" ]; then
            cp "${current}/.env.local" "${release_dir}/.env.local"
          fi

          dropin_dir="/etc/systemd/system/${service}.d"
          override="${dropin_dir}/axein-release.conf"
          previous_override="${build_root}/previous-axein-release.conf"
          had_override=0
          if sudo test -f "${override}"; then
            sudo cat "${override}" > "${previous_override}"
            had_override=1
          fi

          rollback_service() {
            echo "Deployment check failed. Restoring the previous service configuration." >&2
            if [ "${had_override}" -eq 1 ]; then
              sudo install -D -m 644 "${previous_override}" "${override}"
            else
              sudo rm -f "${override}"
            fi
            sudo systemctl daemon-reload
            sudo systemctl restart "${service}" || true
          }

          {
            printf '[Service]\n'
            printf 'WorkingDirectory=%s\n' "${release_dir}"
            printf 'ExecStart=\n'
            printf 'ExecStart=%s %s/server.js\n' "${node_bin}" "${release_dir}"
          } > "${build_root}/axein-release.conf"
          sudo install -D -m 644 "${build_root}/axein-release.conf" "${override}"
          sudo systemctl daemon-reload
          if ! sudo systemctl restart "${service}"; then
            rollback_service
            exit 1
          fi

          ready=0
          for attempt in $(seq 1 20); do
            if sudo systemctl is-active --quiet "${service}" \
              && curl -fsS --max-time 15 \
                -H 'Cache-Control: no-cache' \
                "https://axein.in/axein-billing/handbook?release=${REVISION:0:12}" \
                | grep -q 'Axein Billing Pro Handbook'; then
              ready=1
              break
            fi
            sleep 3
          done
          if [ "${ready}" -ne 1 ]; then
            sudo journalctl -u "${service}" -n 100 --no-pager || true
            rollback_service
            exit 1
          fi

          rm -f "${bundle}"
          rmdir "${STAGING}" 2>/dev/null || true
          echo "Website deployment completed through ${service} at revision ${REVISION}."
          REMOTE_SCRIPT
