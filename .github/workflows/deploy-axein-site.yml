name: Deploy Axein website

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: axein.in branch or tag to deploy
        required: true
        default: main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure release server access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AXEIN_RELEASE_SSH_KEY }}
          SSH_HOST: ${{ secrets.AXEIN_RELEASE_SSH_HOST }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}" || { echo "AXEIN_RELEASE_SSH_KEY is not configured"; exit 1; }
          test -n "${SSH_HOST}" || { echo "AXEIN_RELEASE_SSH_HOST is not configured"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/axein_release
          chmod 600 ~/.ssh/axein_release
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Build and deploy current website source
        env:
          SSH_HOST: ${{ secrets.AXEIN_RELEASE_SSH_HOST }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/axein_release "axein@${SSH_HOST}" \
            "SOURCE_REF='${SOURCE_REF}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          source_repo=""
          while IFS= read -r git_marker; do
            candidate="${git_marker%/.git}"
            remote_url="$(git -C "${candidate}" remote get-url origin 2>/dev/null || true)"
            if printf '%s' "${remote_url}" | grep -qi 'shaikhismail142/axein\.in' \
              && [ -f "${candidate}/platform/axein-modern/package-lock.json" ]; then
              source_repo="${candidate}"
              break
            fi
          done < <(find /srv/axein -maxdepth 6 \( -type d -o -type f \) -name .git 2>/dev/null | sort)

          if [ -z "${source_repo}" ]; then
            echo "Could not find an axein.in checkout with platform/axein-modern under /srv/axein." >&2
            exit 1
          fi

          echo "Using website source: ${source_repo}"
          git -C "${source_repo}" fetch origin "${SOURCE_REF}"
          revision="$(git -C "${source_repo}" rev-parse FETCH_HEAD)"
          release_id="$(date -u +%Y%m%d%H%M%S)-${revision:0:8}"
          build_root="/srv/axein/site-builds/${release_id}"
          build_source="${build_root}/source"
          install -d "${build_root}"
          git -C "${source_repo}" worktree add --detach "${build_source}" "${revision}"

          cleanup_build() {
            git -C "${source_repo}" worktree remove --force "${build_source}" >/dev/null 2>&1 || true
          }
          trap cleanup_build EXIT

          frontend="${build_source}/platform/axein-modern"
          test -f "${frontend}/package-lock.json"
          cd "${frontend}"
          command -v npm >/dev/null
          npm ci
          npm run typecheck
          npm run package:standalone

          service=""
          for candidate in axein-modern.service axein-frontend.service axein-control-room.service; do
            if systemctl cat "${candidate}" >/dev/null 2>&1; then
              service="${candidate}"
              break
            fi
          done
          if [ -z "${service}" ]; then
            echo "No supported Axein Next.js service was found." >&2
            exit 1
          fi
          sudo -n true
          node_bin="$(command -v node)"
          test -x "${node_bin}"

          current="$(systemctl show "${service}" --property=WorkingDirectory --value)"
          release_dir="/srv/axein/site-releases/${release_id}"
          install -d "${release_dir}"
          tar -xzf "${frontend}/dist/axein-modern-standalone.tgz" -C "${release_dir}"

          if [ -n "${current}" ] && [ -e "${current}/.env" ]; then
            cp "${current}/.env" "${release_dir}/.env"
          fi
          if [ -n "${current}" ] && [ -e "${current}/.env.local" ]; then
            cp "${current}/.env.local" "${release_dir}/.env.local"
          fi

          dropin_dir="/etc/systemd/system/${service}.d"
          override="${dropin_dir}/axein-release.conf"
          previous_override="${build_root}/previous-axein-release.conf"
          had_override=0
          if sudo test -f "${override}"; then
            sudo cat "${override}" > "${previous_override}"
            had_override=1
          fi

          rollback_service() {
            echo "Deployment check failed. Restoring the previous service configuration." >&2
            if [ "${had_override}" -eq 1 ]; then
              sudo install -D -m 644 "${previous_override}" "${override}"
            else
              sudo rm -f "${override}"
            fi
            sudo systemctl daemon-reload
            sudo systemctl restart "${service}" || true
          }

          {
            printf '[Service]\n'
            printf 'WorkingDirectory=%s\n' "${release_dir}"
            printf 'ExecStart=\n'
            printf 'ExecStart=%s %s/server.js\n' "${node_bin}" "${release_dir}"
          } > "${build_root}/axein-release.conf"
          sudo install -D -m 644 "${build_root}/axein-release.conf" "${override}"
          sudo systemctl daemon-reload
          if ! sudo systemctl restart "${service}"; then
            rollback_service
            exit 1
          fi

          ready=0
          for attempt in $(seq 1 20); do
            if sudo systemctl is-active --quiet "${service}" \
              && curl -fsS --max-time 15 https://axein.in/axein-billing/handbook \
                | grep -q 'Axein Billing Pro Handbook'; then
              ready=1
              break
            fi
            sleep 3
          done
          if [ "${ready}" -ne 1 ]; then
            sudo journalctl -u "${service}" -n 100 --no-pager || true
            rollback_service
            exit 1
          fi

          echo "Website deployment completed through ${service} at revision ${revision}."
          REMOTE_SCRIPT
