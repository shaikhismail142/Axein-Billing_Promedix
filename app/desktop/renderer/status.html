<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AxEin Billing</title>
    <style>
      :root { color-scheme: light; font-family: "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 32px;
        color: #10213d;
        background:
          radial-gradient(circle at 12% 10%, rgba(47, 111, 237, .20), transparent 32%),
          radial-gradient(circle at 88% 80%, rgba(28, 167, 143, .16), transparent 34%),
          #eef4ff;
      }
      main {
        width: min(620px, 100%); padding: 42px; border: 1px solid rgba(31, 74, 143, .16);
        border-radius: 28px; background: rgba(255, 255, 255, .84); box-shadow: 0 30px 90px rgba(31, 74, 143, .16);
        backdrop-filter: blur(20px);
      }
      .brand { display: flex; align-items: center; gap: 14px; }
      .mark { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 16px; color: white; background: #1f4a8f; font-weight: 800; }
      h1 { margin: 0; font-size: 26px; letter-spacing: -.03em; }
      .eyebrow { margin: 2px 0 0; color: #60728d; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      .status { margin-top: 34px; padding: 22px; border-radius: 18px; background: #f5f8fd; }
      h2 { margin: 0; font-size: 18px; }
      #detail { min-height: 22px; margin: 8px 0 0; color: #60728d; line-height: 1.5; }
      .bar { height: 5px; margin-top: 22px; overflow: hidden; border-radius: 99px; background: #dce5f4; }
      .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #1f4a8f, #1ca78f); animation: loading 1.2s ease-in-out infinite alternate; }
      footer { margin-top: 20px; color: #73839b; font-size: 12px; text-align: center; }
      @keyframes loading { from { transform: translateX(-70%); } to { transform: translateX(220%); } }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <div class="mark">AB</div>
        <div><h1>AxEin Billing</h1><p class="eyebrow">Local business workspace</p></div>
      </div>
      <section class="status">
        <h2 id="title">Preparing your workspace</h2>
        <p id="detail">Checking the local billing services...</p>
        <div class="bar"></div>
      </section>
      <footer>Your data stays in the local Docker volumes on this computer.</footer>
    </main>
    <script>
      window.axeinDesktop.onStatus(({ title, detail }) => {
        document.getElementById("title").textContent = title || "Working";
        document.getElementById("detail").textContent = detail || "";
      });
    </script>
  </body>
</html>
